services:
  backend:
    build: ./traffic_system
    env_file:
      - ./traffic_system/.env
    ports:
      - "8000:8000"
    environment:
      STUDY_NETWORK_PATH: /app/data/processed/study_network.json
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./traffic_system/data:/app/data
